  evidenza: false
  specifiche:
    - voce: "Programmazione"
      valore: "Interamente personalizzata su obiettivi ed esigenze dell'atleta"
    - voce: "Assistenza"
      valore: "Contatto diretto e prioritario"
    - voce: "Requisiti"
      valore: "Cardiofrequenzimetro o power meter"
    - voce: "Durata"
      valore: "Definita in base agli obiettivi dell'atleta"

<section class="cta diag">
  <div class="wrap">
    <span class="eyebrow">Il tuo prossimo livello inizia qui</span>
    <h2>Prendi in mano <span class="rosso">la tua performance</span></h2>
    <p class="lead center" style="margin-inline:auto">
      Raccontami obiettivo, livello attuale e cosa vuoi migliorare.
      Ti rispondo con indicazioni chiare sui prossimi passi.
    </p>

    <a class="cta__tel" href="tel:+{{ site.contatti.telefono_intl }}">{{ site.contatti.telefono }}</a>

    <div class="btn-row">
      <a class="btn btn--wa" href="https://wa.me/{{ site.contatti.telefono_intl }}?text={{ site.contatti.whatsapp_msg | uri_escape }}">
        Scrivimi su WhatsApp
      </a>
      <a class="btn btn--ghost" href="mailto:{{ site.contatti.email }}">Scrivi una mail</a>
    </div>
  </div>
</section>

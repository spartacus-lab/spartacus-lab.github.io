<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · Spartacus{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | truncate: 160 }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Spartacus">
<meta property="og:locale" content="it_IT">
<meta property="og:title" content="{% if page.title and page.url != '/' %}{{ page.title }} · Spartacus{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | truncate: 160 }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="theme-color" content="#08080a">

<link rel="icon" href="{{ '/assets/img/logo-mark.svg' | relative_url }}" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,500;1,700;1,800&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "Spartacus — Biomeccanica e Allenamento",
  "description": {{ site.description | strip_newlines | jsonify }},
  "url": {{ site.url | jsonify }},
  "telephone": {{ site.contatti.telefono | jsonify }},
  "email": {{ site.contatti.email | jsonify }},
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Pescina",
    "addressRegion": "AQ",
    "addressCountry": "IT"
  },
  "founder": { "@type": "Person", "name": "Giuseppe Roscigno" },
  "areaServed": "Marsica, Abruzzo"
}
</script>

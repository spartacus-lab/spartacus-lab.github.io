<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand brand--logo" href="{{ '/' | relative_url }}" aria-label="Spartacus — home">
      <img src="{{ '/assets/img/logo-spartacus.jpg' | relative_url }}"
           alt="Spartacus — Biomeccanica e Allenamento" width="470" height="276">
    </a>

    <button class="nav-toggle" aria-label="Apri il menu" aria-expanded="false" aria-controls="nav">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" id="nav">
      {% assign voci = "/metodo/|Metodo,/coaching/|Coaching,/bike-fitting/|Bike Fitting,/vetrina/|Vetrina,/approfondimenti/|Articoli,/eventi/|Eventi,/chi-sono/|Chi Sono" | split: "," %}
      {% for voce in voci %}
        {% assign p = voce | split: "|" %}
        <a href="{{ p[0] | relative_url }}"{% if page.url contains p[0] %} class="is-active"{% endif %}>{{ p[1] }}</a>
      {% endfor %}
      <button type="button" id="lang-toggle" class="nav__lang" aria-label="Switch to English">EN</button>
      <a class="btn btn--primary nav__cta" href="{{ '/contatti/' | relative_url }}">Contatti</a>
    </nav>
  </div>
</header>

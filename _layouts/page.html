---
layout: default
---
<section class="page-head diag">
  <div class="wrap">
    {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</section>

<section class="section">
  <div class="wrap">
    {% if page.full_width %}
      {{ content }}
    {% else %}
      <div class="prose">{{ content }}</div>
    {% endif %}
  </div>
</section>

{% unless page.no_cta %}{% include cta.html %}{% endunless %}
